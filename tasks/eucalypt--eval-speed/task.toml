schema_version = "1.3"

[task]
name = "perfrace/eucalypt--eval-speed"
description = "Optimize the eucalypt interpreter on an Advent of Code workload"
keywords = ["source:upstream-pin", "category:interpreter-runtime", "scale:project-level"]

[perfrace.measurement]
measurement = "wall-clock"
unit = "seconds"
direction = "minimize"
workload = "day06-part-2"
n_warmup = 1
n_repetitions = 3
aggregator = "mean"
repetition_scope = "internal"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 900

[environment]
network_mode = "public"
cpus = 2
memory_mb = 16384
workdir = "/home/user/workspace"
