schema_version = "1.3"

[task]
name = "perfrace/n8n-mcp--tool-batch-speed"
description = "Optimize n8n-mcp on a fixed MCP tool-call batch"
authors = [{ name = "PerfRace" }]
keywords = ["source:upstream-pin", "category:mcp-server", "scale:project-level"]

[perfrace.measurement]
measurement = "wall-clock"
unit = "seconds"
direction = "minimize"
workload = "mcp-tool-call-batch"
n_warmup = 2
n_repetitions = 5
aggregator = "mean"
repetition_scope = "internal"

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 300

[environment]
workdir = "/home/user/workspace"
network_mode = "public"
cpus = 4
memory_mb = 16384
