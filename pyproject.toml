[project]
name = "boxbox"
version = "0.1.0"
description = "BOXBOX self-modifying agent and PerfRace evaluation tools"
requires-python = ">=3.12,<3.14"
dependencies = [
  "harbor==0.20.0", "openai>=2.16.0", "anthropic", "litellm>=1.83.14",
  "fastapi>=0.135.0", "uvicorn>=0.42.0", "websockets>=15.0",
  "markdown-it-py>=4.0.0", "matplotlib>=3.11.1", "pydantic>=2.0",
  "typer>=0.20.0", "tenacity", "pyyaml", "pathspec", "requests",
]
[project.optional-dependencies]
evolution = ["nexau", "sqlalchemy[asyncio]"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "pytest-cov", "ruff"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project.scripts]
perfrace = "perfrace.cli:main"
[tool.uv.sources]
nexau = { git = "https://github.com/nex-agi/NexAU.git", rev = "v0.3.9" }
harbor = { path = "vendor/harbor", editable = true }
[tool.hatch.build.targets.wheel]
packages = ["perfrace", "boxbox"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 99
target-version = "py312"
